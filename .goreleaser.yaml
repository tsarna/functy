# GoReleaser configuration — https://goreleaser.com
# Cross-compiles the CLI, builds archives + checksums, and cuts a GitHub
# Release on tag push. The library is consumed via `go get` and needs no
# release step; the same vX.Y.Z tag serves both.
version: 2

project_name: functy

before:
  hooks:
    - go mod tidy

builds:
  - id: functy
    main: ./cmd/functy
    binary: functy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: functy
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The release body comes from CHANGELOG.md via --release-notes (see the release
# workflow), so GoReleaser's own changelog generation is disabled.
changelog:
  disable: true

release:
  prerelease: auto

# Publish a Homebrew cask to tsarna/homebrew-tap so macOS users can
# `brew install tsarna/tap/functy`. Casks are macOS-only; Linux users use the
# archives or `go install`. Prerelease tags skip the tap (skip_upload: auto).
homebrew_casks:
  - name: functy
    repository:
      owner: tsarna
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/tsarna/functy"
    description: "Run and check functy (.cty) source files"
    skip_upload: "auto"
    # The macOS binaries are unsigned, so Gatekeeper quarantines them and
    # refuses to run them. Strip the quarantine attribute on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/functy"]
          end
